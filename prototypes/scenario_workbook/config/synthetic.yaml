# Test 4: one Baseline scenario per world, with a pool multiplier, a bonus and a yield shift drawn from these ranges.
test4:
  pool_multiplier: [0.9, 1.5]
  bonus_usd: [0, 10000]
  bonus_scope: residency_out
  yield_shift_pts: [-2, 2]
  draws: 40000
  tolerance: 0.02
