# Synthetic-world config for the Phase 1 tests (spec sections 2, 10, 11). Every value here is synthetic.
# The band grid and thresholds are law-style (spec section 2); tuition, need and targets are invented values.
# Generator parameters carry over ranges and parameters only (spec rule 4); provenance in docs/shape_targets.md.

client:
  id: synthetic
  name: Synthetic law world
  vertical: law
  small_cell_policy: none

cycle:
  base_cycle: 2026
  plan_cycle: 2027
  history: [2024, 2025, 2026]

# Synthetic tuition path: steps of about 3.7% and 4.0%, rounded to $50; plan step 6.0%.
tuition_by_cohort: {2024: 50000, 2025: 51850, 2026: 53900}
tuition_base: 53900
tuition_increase_by_year: {2027: 6.0}
tuition_rounding_usd: 50

score:
  measure: score
  bands: [170, 167, 166, 165, 161, 158, 154, 152, 0]
  pool_threshold: 165
  floor: 154
  median_thresholds: [166, 165]

gpa:
  measure: gpa
  hi_at_or_above: 3.83
  classes: [hi, lo, blank]
  median_threshold: 3.83

unscored_in_median: excluded

class:
  cap: 140
  target: 140
  band: 4
  what_if: [100, 105, 110, 115, 120, 125, 130, 135, 140]
  supported_range: [100, 140]
  reject_range: [84, 154]

need:
  total: 175000
  reference_class: 140

ntr_target: 4300000

risk:
  common_shock_sd: 0.10
  shock_source: illustrative
  shock_corr_above_below: 1.0
  sensitivity_slopes: {low: 0.5, middle: 1.0, high: 1.5}
  yield_floor: {upper: 0.03, lower: 0.03}
  yield_cap: {upper: 0.60, lower: 0.60}
  yield_shift_grid: [-3, -2, -1, 0, 1, 2, 3]
  pool_grid: [0.8, 0.9, 1.0, 1.1, 1.2, 1.3, 1.4, 1.5, 1.6]
  tuition_grid: [5.0, 5.5, 6.0, 6.5]

pooling_k: 20
integer_admits: false
integer_enrolled: false
evidence_tolerance_usd: 2500

segments:
  - name: priority
    within: {residency: out}
    members_label: synthetic priority segment
    share_source: assumed

trim:
  protect_segment: below_threshold
  floor_rate: 0.0
  exempt_cells: []

pool_ytd_growth: null
marginal_admit_yield_slope: 0

# ---------------------------------------------------------------------------------------------------------------
