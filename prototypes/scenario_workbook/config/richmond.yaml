# Richmond client config (spec section 2). Client-confidential: Richmond values live only here (spec rule 7).
# Values are those stated in Prototype_Spec_Scenario_Workbook_v0.6.md section 2 and CLAUDE.md.
#
# PENDING (Jason): tuition_by_cohort and tuition_base are null on purpose. The only source on hand is the
# Yellow Arrows fixture, whose cell values may not be copied into config (spec rule 3). Enter Richmond's published
# tuition by cohort; until then sw.config.load raises an error naming these fields.

client:
  id: richmond_law
  name: University of Richmond School of Law
  vertical: law
  small_cell_policy: none          # named, authenticated roles only; methodology section 9 [v0.6, B2-3]

cycle:
  base_cycle: 2026
  plan_cycle: 2027
  history: [2024, 2025, 2026]

tuition_by_cohort: null            # PENDING: {2024: ..., 2025: ..., 2026: ...}
tuition_base: null                 # PENDING: tuition in base_cycle
# 2027 tuition in dollars [v0.6.3, BM-2]: $63,500 proposed (Brandon, Nov 17; confirmed by Jason Nov 18; Board approval
# February 2027). Baseline's increase is the implied 100 x (63,500 / tuition_base - 1), unrounded. The 5.5% planning
# placeholder is retired. Reproduce mode ignores this and uses reproduce.tuition_increase_pct with the fixture's tuition.
tuition_by_year_usd: {2027: 63500}
tuition_rounding_usd: 50

score:
  measure: LSAT
  bands: [170, 167, 166, 165, 161, 158, 154, 152, 0]
  pool_threshold: 165
  floor: 154
  # [v0.6.3, BM-1] percentile targets {q, t}; t must be a band lower bound. The two medians as before; q = 0.25 at 158 is
  # a placeholder: the nearest band bound at or below Richmond's published ABA 509 25th percentile (158 in 2024, 159 in
  # 2025) until Brandon names the target (OD-13). q = 0.10 is unset. score.median_thresholds is derived (q = 0.5).
  percentile_targets:
    - {q: 0.5, t: 166}
    - {q: 0.5, t: 165}
    - {q: 0.25, t: 158}          # placeholder, nearest band bound at or below the 509 figure; OD-13

gpa:
  measure: UGPA
  hi_at_or_above: 3.83
  classes: [hi, lo, blank]
  median_threshold: 3.83

unscored_in_median: excluded       # the ABA 509 basis (Review_Phase3_Build.md; O41); reproduce mode uses the same

class:
  cap: 140                         # hard this cycle
  target: 140
  band: 4
  what_if: [100, 105, 110, 115, 120, 125, 130, 135, 140]
  supported_range: [100, 140]
  # reject_range: product default 0.6 x cap to 1.1 x cap

need:
  total: 200000
  reference_class: 140

ntr_target: null
ntr_goal_basis: entering_y1        # [v0.6.3, BM-4] all_jd needs continuing_ntr_usd from Richmond (data need)
continuing_ntr_usd: null
discount_target: null              # which discount rate the Dean means is open (OD-05)

risk:
  common_shock_sd: 0.10            # illustrative until calibrated (O37)
  shock_source: illustrative
  shock_corr_above_below: 1.0
  sensitivity_slopes: {low: 0.5, middle: 1.0, high: 1.5}   # placeholders (D6)
  yield_floor: {upper: 0.03, lower: 0.03}
  yield_cap: {upper: 0.60, lower: 0.60}
  yield_shift_grid: [-3, -2, -1, 0, 1, 2, 3]
  pool_grid: [0.8, 0.9, 1.0, 1.1, 1.2, 1.3, 1.4, 1.5, 1.6]
  tuition_grid: [5.0, 5.5, 6.0, 6.5]

pooling_k: 20
integer_admits: false
integer_enrolled: false

# Reproduce mode (spec sections 2 and 9; python -m sw.reproduce). Tuition by cohort and each scenario's tuition are
# loaded from the validation fixture at run time and never written here (spec rule 3). sw.reproduce sets integer
# admits and enrolled and reports the fixture's own counting rule beside the setting below.
reproduce:
  tuition_increase_pct: 6.0        # reproduce mode (D4); a Check compares the formula with the loaded tuition
  unscored_in_median: excluded     # the fixture's count rows use this rule (DECISIONS Nov 18; confirmed on load)
  round_apps_after_pool: true      # whole applications after the pool multiplier, reproduce mode only (DECISIONS Nov 18)

# Public ABA 509 figures per history cohort for the History sheet's 509 reconciliation (report only; R3-4). Optional
# keys: first_year_class, without_score, without_gpa, score_p25/p50/p75, gpa_p25/p50/p75. Entered Nov 18 from
# the ABA compilations (public); add 2026 when the 2026 report is published.
aba_509_by_cohort:                 # public ABA 509 compilations (report year = fall entering class); 2026 not yet published
  2024: {first_year_class: 133, without_score: 0, without_gpa: 0, score_p25: 158, score_p50: 164, score_p75: 165, gpa_p25: 3.50, gpa_p50: 3.75, gpa_p75: 3.83}
  2025: {first_year_class: 146, without_score: 2, without_gpa: 1, score_p25: 159, score_p50: 164, score_p75: 167, gpa_p25: 3.66, gpa_p50: 3.81, gpa_p75: 3.92}
evidence_tolerance_usd: 2500

segments:
  - name: target_states
    within: {residency: out}
    members_label: NY, PA
    share_source: assumed          # until state-level counts arrive

trim:
  protect_segment: above_floor     # [v0.6.3, BM-5] NY/PA protected only at or above score.floor (Brandon, Nov 17)
  floor_rate: 0.0
  exempt_cells: []

pool_ytd_growth: null              # [v0.6.3, BM-6] applications at or above score.pool_threshold vs the same week last cycle
pool_ytd_as_of: null
marginal_admit_yield_slope: 0

# R4-06 (Jason, Nov 19, 2026): every median and percentile figure on the Summary reads "held pending confirmation of
# the LSAT basis (OD-14)" until Brandon says which LSAT the Yellow Arrows grid bands by.
hold_position_rows: true
